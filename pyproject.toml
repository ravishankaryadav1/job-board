[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucsf-aicd3-job-board"
version = "0.1.0"
description = "Auditable, configurable pharma/biotech opportunity tracker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobboard = "jobboard.cli:main"

[tool.setuptools]
packages = ["jobboard"]

[tool.setuptools.package-data]
jobboard = ["web/*"]
